  <rect x="94" y="547" width="828" height="176" rx="4" fill="#3A4658"/>
  <text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="110" y="583">The Transformer is a model architecture that relies entirely on an attention</tspan>
    <tspan x="110" y="613">mechanism to draw global dependencies between input and output,</tspan>
    <tspan x="110" y="643">eschewing recurrence.</tspan>
  </text>
